GoalDecision:
  # Action: StartOptimization
  # Action: NextOptimization
  Action: GoalAchieved
  # Action: StopOptimizing

  # Reason: GoalsFailed
  # Reason: GoalNotYetAchieved
  Reason: AllGoalsSatisfied
  # Reason: NoFurtherImprovementsFound
    
  OptimizationHypothesis:
    - FailedGoal: "CapitalGainPercent"

      Explanation: >
        Capital growth below target while drawdown, trade count
        and winning percentage satisfy their targets. The strategy
        appears profitable but is not producing enough total return.

      SuggestedChanges:
        - File: src/resources/application-data/profiles.yaml

          PythonExpression: >
            next(
              p for p in payload["Profiles"]
              if p["Profile"]["Name"] == "asyafoek-stocks-long"
            )["Strategy"]["PositionManagement"]["MaxTradesPerDay"]

          CurrentValue: 100
          SuggestedValue: 200

      Confidence: 0.82

      ExpectedImpact:
        CapitalGainPercent: Increase
        DrawdownPercent: Unknown
        WinningTradePercentage: Neutral
        TradeCount: Increase


